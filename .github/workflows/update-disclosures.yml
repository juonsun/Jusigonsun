name: DART 공시 자동 업데이트

on:
  schedule:
    # 매일 07:00 KST(=전날 22:00 UTC)에 실행
    - cron: "0 22 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  fetch-disclosures:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: npm install

      - name: corp-codes.json이 비어있으면 최초 1회 생성
        run: |
          if [ "$(cat corp-codes.json)" = "{}" ]; then
            npm run lookup-corp-codes
          fi
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: 최근 공시 조회
        run: npm run fetch-disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add disclosures.json corp-codes.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: DART 공시 데이터 갱신"
          git push
